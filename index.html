<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaySa</title>
    <!-- DaisyUi CDN -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-500">
    <section class="max-w-md min-h-screen mx-auto bg-slate-100 py-6  ">
        <header>
            <nav class="flex justify-center items-center">
                <div class="flex justify-center items-center">
                    <img src="assets/Logo-full.png" alt="">
                   
                </div>
            </nav>
        </header>
        <!-- login form -->
         <div class="my-auto">
  <div class="hero-content flex-col ">
  
    <div class="card bg-base-100 w-full max-w-md shrink-0 shadow-2xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label font-semibold text-black">Account</label>
          <input type="account" class="input" placeholder="Enter Account Number" />
          <label class="label font-semibold text-black">Pin</label>
          <input type="pin" class="input" placeholder="Enter Pin" />
          <div><a class="link link-hover">Forgot password?</a></div>
          <button class="btn btn-primary mt-4 rounded-3xl">Login</button>
        </fieldset>
      </div>
    </div>
  </div>
</div>

    </section>
</body>
</html>
