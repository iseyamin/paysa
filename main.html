<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard</title>
    <!-- DaisyUi CDN -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- font aw -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="bg-slate-500">
    <section class="max-w-md min-h-screen mx-auto bg-slate-100 py-6 ">
        <header>
            <div class="navbar bg-base-100 shadow-sm px-6">
  <div class="flex-none">
    <img src="assets/logo.png" alt="" class="h-8 w-8">
  </div>
  <div class="flex-1 ml-3">
    <h1 class="font-semibold text-xl">$450</h1>
    <p class="text-xs text-gray-500">Available balance</p>
  </div>
  <div class="flex-none">
    <button class="btn btn-square btn-ghost">
        <i class="fa-solid fa-right-from-bracket inline rotate-180"></i>logout
    </button>
  </div>
</div>

                <img src="assets/logo.png" alt="" class="h-8 w-8">
                <div>
                    <h1>$466</h1>
                    <p>Available Balance</p>
                    <i class="fa-solid fa-right-from-bracket"></i>
                </div>
                <button><i class="fa-solid fa-right-from-bracket"></i>
                    Logout</button>
            </nav> -->
        </header>
        <!-- text section -->
    <div class="banner p-6">
        <h1 class="font-bold text-xl">Welcome to Pay<span class="text-purple-800">sa</span></h1>
        <p class="text-lg text-gray-600">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>
    </div>
    <!-- box card -->
     <div class="cards grid grid-cols-3 mx-6 gap-3 ">
        <div class="box border text-center p-4 rounded-sm">
            <img class="mx-auto" src="assets/opt-1.png" alt="">
            <h1>Add money</h1>
        </div>
        <div class="box border text-center p-4 rounded-sm">
            <img class="mx-auto" src="assets/opt-2.png" alt="">
            <h1>Cash out</h1>
        </div>
        <div class="box border text-center p-4 rounded-sm">
            <img class="mx-auto" src="assets/opt-3.png" alt="">
            <h1>Transfer Money</h1>
        </div>
        <div class="box border text-center p-4 rounded-sm">
            <img class="mx-auto" src="assets/opt-4.png" alt="">
            <h1>Get Bonus</h1>
        </div>
        <div class="box border text-center p-4 rounded-sm">
            <img class="mx-auto" src="assets/opt-5.png" alt="">
            <h1>Pay Bill</h1>
        </div>
        <div class="box border text-center p-4 rounded-sm">
            <img class="mx-auto" src="assets/opt-6.png" alt="">
            <h1>Transactions</h1>
        </div>
        
     </div>
     <section class="mt-6">
        <h2 class="text-center">Add Money</h2>
        <div class="">
  <div class=" flex-col lg:flex-row-reverse p-4">
   
    <div class="">
      <div class="card-body">
        <fieldset class="fieldset">
            <legend>Select Bank</legend>
            <select class="select">
  <option disabled selected>Pick a Bank</option>
  <option value="bkash">Bkash</option>
  <option value="nagad">Nagad</option>
  <option value="upay">Upay</option>
</select>
          <label class="label font-semibold text-black">Account</label>
          <input value="12345678900" id="account-no" type="text" class="input" placeholder="Enter Account Number" required />
          <label class="label font-semibold text-black">Pin</label>
          <input id="pin" type="pin" class="input" placeholder="Enter Pin" required/>
          <div><a class="link link-hover">Forgot password?</a></div>
          <button class="btn btn-primary mt-4 rounded-3xl">Add Money</button>
        </fieldset>
      </div>
    </div>
  </div>
</div>
    </section>

    </section>
